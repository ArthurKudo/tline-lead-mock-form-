<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Line — Obrigado</title>
<style>
  :root{
    --bg:#f3f5f7;
    --surface:#ffffff;
    --border:#dbe2e8;
    --text:#182029;
    --text-muted:#5b6b78;
    --accent:#296b41;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161c;
      --surface:#171e26;
      --border:#2c3742;
      --text:#e7edf2;
      --text-muted:#9aa8b4;
      --accent:#72d99a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161c;
    --surface:#171e26;
    --border:#2c3742;
    --text:#e7edf2;
    --text-muted:#9aa8b4;
    --accent:#72d99a;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 32px;
    max-width:480px;
    width:100%;
    text-align:center;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.15);
  }
  .check{
    width:48px;height:48px;border-radius:50%;
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    font-size:1.4rem;
  }
  h1{font-size:1.3rem;margin:0 0 10px;}
  p{color:var(--text-muted);font-size:.92rem;line-height:1.5;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Recebemos seus dados</h1>
    <p>Obrigado pelo contato — em breve um consultor T-Line vai falar com você.</p>
  </div>
</body>
</html>
